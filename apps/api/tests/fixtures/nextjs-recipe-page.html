  "recipeIngredient": [

    "1–2 tbsp Chili crisp, to taste",
    "1-2 tsp Fish Sauce",

  "recipeInstructions": [
    {
      "@type": "HowToStep",
      "text": "Heat a large skillet over medium-high heat."

    {
      "@type": "HowToStep",
      "text": "Add ground pork to a dry pan. Oil is not needed, but if your pork has low fat content, add a bit of neutral oil to help it crisp."
    },
    {
      "@type": "HowToStep",
      "text": "Spread into an even layer and do not touch for 2–3 minutes until deeply browned and fat renders."
    },
    {
      "@type": "HowToStep",
      "text": "Break pork into chunks, leaving some crispy bits intact.",

      "text": "Push pork toward the edges of the pan."

      "@type": "HowToStep",
      "text": "Optional: Crack an egg into the pan off heat and stir quickly for a touch of scrambled egg."

    {
      "@type": "HowToStep",
      "text": "Add cabbage and scallion whites to the center and let it cook in the rendered pork fat."

    {
      "@type": "HowToStep",
      "text": "Cook until softened with light char, about 1 minute.",
      "image": "https://jeulkaaefhxbilxrnnap.supabase.co/storage/v1/object/public/recipe-images/b2e4e3e479fc96f3.webp"
    },
    {
      "@type": "HowToStep",
      "text": "Add drained rice noodles and fish sauce to the skillet."
    },
    {
      "@type": "HowToStep",
      "text": "Pour in enough chicken broth to just barely cover the noodles."
    },
    {
      "@type": "HowToStep",
      "text": "Scrape the bottom of the pan to release browned bits.",
      "image": "https://jeulkaaefhxbilxrnnap.supabase.co/storage/v1/object/public/recipe-images/d6f3ff18b6cb37fb.webp"

    {
      "@type": "HowToStep",
      "text": "Bring to a strong boil and toss constantly."
    },
    {
      "@type": "HowToStep",
      "text": "As the liquid reduces, pork fat and noodle starch emulsify into a glossy sauce."
    },
    {
      "@type": "HowToStep",
      "text": "Cook until noodles are tender and sauce clings tightly with a small puddle remaining.",

      "text": "Add soy sauce and chili crisp and toss once more."

      "@type": "HowToStep",
